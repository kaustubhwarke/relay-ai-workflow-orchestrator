name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start a real PostgreSQL with Testcontainers (Docker is available on ubuntu runners).
      # Recent runner images ship a Docker engine whose minimum API is 1.40; pin the client to a supported API version.
      - name: Configure the Docker client API version for Testcontainers
        run: echo "api.version=1.44" > ~/.docker-java.properties
      - name: mvn verify
        run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
          retention-days: 14

  e2e-smoke:
    name: End-to-end smoke test on the container stack
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start the stack (offline AI model; no secrets needed)
        run: |
          cp .env.example .env
          sed -i 's/^RELAY_AI_PROVIDER=.*/RELAY_AI_PROVIDER=heuristic/' .env
          docker compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Provided smoke test
        run: python scripts/smoke_test.py --url http://localhost:8080 --token change-me-demo-token
      - name: Kill-and-resume drill with duplication check
        run: |
          python scripts/run_drills.py --url http://localhost:8080 --token change-me-demo-token --skip-ai \
            --kill-cmd "docker compose kill -s KILL relay-worker" \
            --start-cmd "docker compose start relay-worker" \
            --ai-label "offline heuristic model (CI)" --out verification-report.md
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification-report.md
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -300
      - name: Tear down
        if: always()
        run: docker compose down -v

  docker-image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: relay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
